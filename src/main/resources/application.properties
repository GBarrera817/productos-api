#spring.application.name=productos-api
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:productosdb

spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=productos_db;encrypt=false

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

#logging.level.org.springframework.security=DEBUG

spring.jpa.open-in-view=false
logging.level.com.example.productos_api=${LOG_LEVEL:INFO}